<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Hyrule Bar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans Myanmar', sans-serif;
      background-color: #0b111e;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }
    .mm-text {
      line-height: 1.8;
    }
    .game-case {
      aspect-ratio: 2 / 3;
    }
    /* Smooth Bottom Sheet Animation */
    .drawer-enter {
      transform: translateY(100%);
    }
    .drawer-open {
      transform: translateY(0);
    }
  </style>
</head>
<body class="min-h-screen pb-24 selection:bg-amber-500 selection:text-slate-950">

  <!-- Top Tavern Header -->
  <header class="sticky top-0 z-20 bg-slate-950/90 backdrop-blur-md border-b border-amber-500/20 px-4 py-3.5">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2.5">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center text-slate-950 font-extrabold shadow-md shadow-amber-500/20">
            ⚔️
          </div>
          <div>
            <h1 class="text-lg font-extrabold tracking-tight text-amber-400 leading-none">The Hyrule Bar</h1>
            <p class="text-[11px] text-slate-400 mt-0.5">Nintendo Switch 2 Virtual Game Cards</p>
          </div>
        </div>
        <span id="gameCount" class="sm:hidden text-xs bg-slate-800 text-amber-300 px-2.5 py-1 rounded-full font-semibold">
          Loading...
        </span>
      </div>

      <div class="flex items-center gap-2">
        <input id="searchInput" type="search" placeholder="Search games..."
          class="w-full sm:w-64 px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700/80 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-400" />
      </div>
    </div>
  </header>

  <!-- Main Tall Game Case Shelf -->
  <main class="max-w-4xl mx-auto px-4 pt-5">
    <!-- Filter & Sort Bar -->
    <div class="flex items-center justify-between gap-2 mb-4">
      <button id="availFilterBtn" onclick="toggleAvailableFilter()"
        class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-bold border transition bg-slate-900 text-slate-300 border-slate-700 hover:border-emerald-500/50 shrink-0">
        <span id="availDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
        <span>ငှားလို့ရတာပဲပြပါ။</span>
      </button>

      <div class="flex items-center gap-2">
        <span id="desktopGameCount" class="hidden sm:inline text-xs text-slate-400 font-semibold"></span>
        <select id="sortSelect" onchange="applyFilters()"
          class="px-3 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-slate-300 border border-slate-700 focus:outline-none focus:border-amber-400">
          <option value="default">Sort: Default</option>
          <option value="score-desc">Score: High → Low</option>
          <option value="price-asc">Price: Low → High</option>
          <option value="price-desc">Price: High → Low</option>
          <option value="year-desc">Year: Newest First</option>
          <option value="title-asc">Title: A → Z</option>
        </select>
      </div>
    </div>

    <div id="shelfGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
      <!-- Game cases injected here -->
    </div>
  </main>

  <!-- Floating Tavern Chat Button -->
  <button onclick="openChat()"
    class="fixed bottom-5 right-5 z-20 bg-amber-500 hover:bg-amber-400 active:scale-95 transition text-slate-950 font-bold px-4 py-3 rounded-full shadow-lg shadow-amber-500/25 flex items-center gap-2 text-sm">
    <span>💬</span>
    <span>Tavern Chat</span>
    <span id="chatBadge" class="bg-slate-950 text-amber-400 text-xs px-2 py-0.5 rounded-full">0</span>
  </button>

  <!-- Game Details Bottom Sheet Drawer -->
  <div id="gameModal" onclick="closeGameModal(event)"
    class="fixed inset-0 z-30 bg-black/75 backdrop-blur-xs hidden flex items-end sm:items-center justify-center">
    <div id="gameDrawer" onclick="event.stopPropagation()"
      class="bg-slate-900 border-t sm:border border-slate-700/80 w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[88vh] flex flex-col transition-transform duration-200 drawer-enter shadow-2xl">
      
      <!-- Drag Handle -->
      <div class="w-full flex justify-center pt-3 pb-1 sm:hidden">
        <div class="w-10 h-1.5 rounded-full bg-slate-700"></div>
      </div>

      <div id="gameDrawerBody" class="overflow-y-auto px-5 pb-6 pt-2 space-y-4">
        <!-- Populated dynamically -->
      </div>

      <div class="p-4 border-t border-slate-800 bg-slate-950/60 flex gap-2">
        <button id="askAboutGameBtn"
          class="flex-1 py-2.5 rounded-xl bg-amber-500/15 text-amber-300 border border-amber-500/30 font-semibold text-sm hover:bg-amber-500/25">
          💬 Comment on this game
        </button>
        <button onclick="hideGameModal()"
          class="px-5 py-2.5 rounded-xl bg-slate-800 text-slate-200 font-semibold text-sm hover:bg-slate-700">
          Close
        </button>
      </div>
    </div>
  </div>

  <!-- Tavern Chat / Guestbook Drawer -->
  <div id="chatModal" onclick="closeChatModal(event)"
    class="fixed inset-0 z-40 bg-black/75 backdrop-blur-xs hidden flex items-end sm:items-center justify-center">
    <div onclick="event.stopPropagation()"
      class="bg-slate-900 border-t sm:border border-slate-700/80 w-full max-w-lg rounded-t-3xl sm:rounded-3xl h-[82vh] flex flex-col shadow-2xl">
      
      <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between">
        <div>
          <h2 class="font-bold text-base text-amber-400">🍺 The Hyrule Bar — Guestbook</h2>
          <p class="text-xs text-slate-400">ပြောချင်တာ ပြောခဲ့မယ်</p>
        </div>
        <button onclick="hideChatModal()" class="text-slate-400 hover:text-white text-sm font-semibold px-3 py-1.5 bg-slate-800 rounded-lg">
          Close
        </button>
      </div>

      <!-- Messages List -->
      <div id="chatList" class="flex-1 overflow-y-auto p-4 space-y-3">
        <!-- Messages injected here -->
      </div>

      <!-- Post Message Form -->
      <form id="chatForm" class="p-4 border-t border-slate-800 bg-slate-950/80 space-y-2.5">
        <div class="flex gap-2">
          <input id="chatName" type="text" placeholder="Your Nickname" required
            class="w-1/2 px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-slate-100 focus:outline-none focus:border-amber-400" />
          <select id="chatGameTag"
            class="w-1/2 px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-slate-300 focus:outline-none focus:border-amber-400">
            <option value="General">General Chat</option>
          </select>
        </div>
        <div class="flex gap-2">
          <input id="chatMessage" type="text" placeholder="Game တွေ အကြောင်း ရေးချင်တာ ရေးခဲ့ပါ။" required
            class="flex-1 px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-slate-100 focus:outline-none focus:border-amber-400" />
          <button id="chatSubmitBtn" type="submit"
            class="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm shrink-0">
            Send
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 1. PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BELOW:
    const API_URL = "https://script.google.com/macros/s/AKfycbzJr96keSYR_fwPiOoVcGgl_aGfw9Uy9oJhY2Qd78y0h1iY-zck0ef0VMuYCVJMGFoSuA/exec";

    // Sample starter data (shown automatically until you paste your API_URL)
    const SAMPLE_DATA = {
      games: [
        {
          title: "The Legend of Zelda: Tears of the Kingdom",
          cover: "https://images.igdb.com/igdb/image/upload/t_cover_big/co5vmg.webp",
          price: "155,000 MMK",
          score: "10/10",
          platform: "Switch",
          genre: "Action Adventure",
          players: "1 Player",
          fileSize: "16.3 GB",
          review: "Story ရော Gameplay ရော လုံးဝ Masterpiece ပါ။ Ultrahand နဲ့ ပစ္စည်းတွေ ဆက်ပြီး ကစားရတာ အရမ်းမိုက်သလို Sky Islands နဲ့ Depths ပါ ထပ်ပါလာတော့ နာရီ ၁၀၀ ကျော် အေးဆေးဆော့လို့ရတယ်။ Local market မှာ cartridge ပြန်ရောင်းရလည်း လွယ်လို့ ဝယ်ရတာ တန်ပါတယ်။"
        },
        {
          title: "Super Mario Bros. Wonder",
          cover: "https://images.igdb.com/igdb/image/upload/t_cover_big/co6nnl.webp",
          price: "130,000 MMK",
          score: "9.2",
          platform: "Switch",
          genre: "Platformer",
          players: "1-4 Players",
          fileSize: "4.5 GB",
          review: "သူငယ်ချင်းတွေ မိသားစုတွေနဲ့ အတူတူဆော့ဖို့ အကောင်းဆုံး 2D Mario ဂိမ်းပါ။ Wonder Flower စားလိုက်တိုင်း stage တစ်ခုလုံး ပြောင်းလဲသွားတဲ့ idea က တော်တော် creative ဖြစ်တယ်။ Handheld mode နဲ့ ဆော့ရင် FPS လုံးဝငြိမ်ပါတယ်။"
        }
      ],
      comments: [
        {
          timestamp: "Today",
          name: "Link",
          game: "General",
          message: "Welcome to The Hyrule Bar! Grab a seat and check out the shelf."
        }
      ]
    };

    let state = { games: [], comments: [], posts: [] };

    async function init() {
      // Load cached data first for instant mobile rendering
      const cached = localStorage.getItem('hyrule_bar_cache');
      if (cached) {
        state = JSON.parse(cached);
        renderAll();
      } else {
        state = SAMPLE_DATA;
        renderAll();
      }

      if (!API_URL || API_URL.includes("PASTE_YOUR")) return;

      try {
        const res = await fetch(API_URL);
        const fresh = await res.json();
        if (fresh && Array.isArray(fresh.games)) {
          state = fresh;
          localStorage.setItem('hyrule_bar_cache', JSON.stringify(fresh));
          renderAll();
        }
      } catch (err) {
        console.warn("Using cached/sample data:", err);
      }
    }

    function renderAll() {
      renderShelf(state.games);
      renderComments();
      populateGameDropdown();
    }

    function getAvailabilityBadge(status) {
      if (!status) return '';
      const inHand = /ငှားနိုင်သည်/i.test(status);
      const style = inHand
        ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40'
        : 'bg-rose-500/20 text-rose-300 border-rose-500/40';
      return `<span class="inline-block text-[10px] font-bold border px-2 py-0.5 rounded-md ${style}">${escapeHtml(status)}</span>`;
    }

    function renderShelf(list) {
      const grid = document.getElementById('shelfGrid');
      document.getElementById('gameCount').textContent = `${list.length} Games`;

      grid.innerHTML = list.map((g) => {
        const realIdx = state.games.indexOf(g);
        return `
          <div onclick="openGameModal(${realIdx})"
            class="group bg-slate-900/90 border border-slate-800 hover:border-amber-500/50 rounded-2xl overflow-hidden shadow-lg cursor-pointer transition active:scale-[0.98] flex flex-col">
            <div class="relative game-case w-full bg-slate-800 overflow-hidden">
              <img src="${g.cover}" alt="${g.title}" loading="lazy"
                class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
              ${g.score ? `
                <span class="absolute top-2 right-2 bg-slate-950/85 backdrop-blur-xs text-amber-400 border border-amber-500/30 text-[11px] font-bold px-2 py-0.5 rounded-lg shadow">
                  ★ ${g.score}
                </span>` : ''}
            </div>
            <div class="p-3 flex-1 flex flex-col justify-between">
              <h2 class="font-bold text-xs sm:text-sm text-slate-100 line-clamp-2 leading-snug">${g.title}</h2>
              <div class="flex items-center justify-between gap-1.5 mt-2">
  <p class="text-xs font-bold text-emerald-400 truncate">${g.price || '—'}</p>
  ${getAvailabilityBadge(g.availability)}
</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openGameModal(idx) {
      const g = state.games[idx];
      if (!g) return;

      const gamePosts = (state.posts || []).filter(
        p => p.game.toLowerCase() === g.title.trim().toLowerCase()
      );

      // Build collapsible cards from Posts tab (falls back to g.review if no Posts exist yet)
      const postsHtml = gamePosts.length
        ? gamePosts.map((p, i) => `
            <details ${i === 0 ? 'open' : ''} class="group bg-slate-800/50 border border-slate-700/70 rounded-2xl overflow-hidden">
              <summary class="flex items-center justify-between gap-2 px-4 py-3 cursor-pointer list-none select-none hover:bg-slate-800/80">
                <div class="flex items-center gap-2 min-w-0">
                  <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md bg-amber-500/15 text-amber-300 border border-amber-500/30 shrink-0">
                    ${escapeHtml(p.type)}
                  </span>
                  <span class="text-sm font-bold text-slate-100 truncate">${escapeHtml(p.title)}</span>
                </div>
                <span class="text-slate-400 text-xs transition-transform duration-200 group-open:rotate-180 shrink-0">▼</span>
              </summary>
              <div class="px-4 pb-4 pt-2 border-t border-slate-700/50">
                <p class="text-sm text-slate-200 mm-text whitespace-pre-line">${escapeHtml(p.content)}</p>
              </div>
            </details>
          `).join('')
        : `
            <div class="bg-slate-800/40 border border-slate-800 rounded-2xl p-4">
              <h3 class="text-xs font-bold uppercase tracking-wider text-amber-400 mb-2">Hyrule Bar Review</h3>
              <p class="text-sm text-slate-200 mm-text whitespace-pre-line">${escapeHtml(g.review || 'No review written yet.')}</p>
            </div>
          `;

      document.getElementById('gameDrawerBody').innerHTML = `
        <div class="flex gap-4 items-start">
          <img src="${g.cover}" alt="${g.title}" class="w-24 sm:w-28 game-case object-cover rounded-xl border border-slate-700 shadow-md shrink-0" />
          <div class="space-y-1.5">
            <div class="flex flex-wrap items-center gap-1.5">
              ${g.platform ? `<span class="text-[11px] font-semibold bg-red-500/15 text-red-300 border border-red-500/30 px-2 py-0.5 rounded-md">${g.platform}</span>` : ''}
              ${g.releaseYear ? `<span class="text-[11px] font-semibold bg-slate-800 text-slate-300 border border-slate-700 px-2 py-0.5 rounded-md">${g.releaseYear}</span>` : ''}
              ${g.score ? `<span class="text-[11px] font-bold bg-amber-500/15 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-md">★ ${g.score}</span>` : ''}
              ${getAvailabilityBadge(g.availability)}
            </div>
            <h2 class="text-base sm:text-lg font-extrabold text-white leading-snug">${g.title}</h2>
            <p class="text-sm font-bold text-emerald-400">${g.price || ''}</p>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2 bg-slate-950/70 border border-slate-800 p-3 rounded-2xl text-center">
          <div>
            <span class="block text-[10px] uppercase tracking-wider text-slate-400">Genre</span>
            <span class="text-xs font-semibold text-slate-200">${g.genre || '—'}</span>
          </div>
          <div class="border-x border-slate-800">
            <span class="block text-[10px] uppercase tracking-wider text-slate-400">Players</span>
            <span class="text-xs font-semibold text-slate-200">${g.players || '—'}</span>
          </div>
          <div>
            <span class="block text-[10px] uppercase tracking-wider text-slate-400">Size</span>
            <span class="text-xs font-semibold text-slate-200">${g.fileSize || '—'}</span>
          </div>
        </div>

        ${postsHtml}
      `;

      document.getElementById('askAboutGameBtn').onclick = () => {
        hideGameModal();
        openChat(g.title);
      };

      const modal = document.getElementById('gameModal');
      const drawer = document.getElementById('gameDrawer');
      modal.classList.remove('hidden');
      requestAnimationFrame(() => drawer.classList.remove('drawer-enter'));
    }

    function hideGameModal() {
      const modal = document.getElementById('gameModal');
      const drawer = document.getElementById('gameDrawer');
      drawer.classList.add('drawer-enter');
      setTimeout(() => modal.classList.add('hidden'), 180);
    }

    function closeGameModal(e) {
      if (e.target.id === 'gameModal') hideGameModal();
    }

    // Chat / Guestbook Functions
    function populateGameDropdown() {
      const select = document.getElementById('chatGameTag');
      select.innerHTML = `<option value="General">General Chat</option>` +
        state.games.map(g => `<option value="${g.title}">${g.title}</option>`).join('');
    }

    function renderComments() {
      const list = document.getElementById('chatList');
      document.getElementById('chatBadge').textContent = state.comments.length;

      if (!state.comments.length) {
        list.innerHTML = `<p class="text-center text-xs text-slate-500 py-8">No messages yet. Be the first traveler to leave a note!</p>`;
        return;
      }

      list.innerHTML = state.comments.map(c => `
        <div class="bg-slate-800/70 border border-slate-700/60 rounded-2xl p-3.5 space-y-1">
          <div class="flex items-center justify-between gap-2">
            <span class="font-bold text-xs text-amber-300">${escapeHtml(c.name)}</span>
            <span class="text-[10px] text-slate-400">${escapeHtml(c.timestamp)}</span>
          </div>
          ${c.game && c.game !== 'General' ? `
            <span class="inline-block text-[10px] bg-slate-900 text-slate-300 px-2 py-0.5 rounded-md border border-slate-700">
              🎮 ${escapeHtml(c.game)}
            </span>` : ''}
          <p class="text-sm text-slate-100 mm-text break-words">${escapeHtml(c.message)}</p>
        </div>
      `).join('');
    }

    function openChat(preselectGame = 'General') {
      const select = document.getElementById('chatGameTag');
      if (preselectGame) select.value = preselectGame;
      document.getElementById('chatModal').classList.remove('hidden');
    }

    function hideChatModal() {
      document.getElementById('chatModal').classList.add('hidden');
    }

    function closeChatModal(e) {
      if (e.target.id === 'chatModal') hideChatModal();
    }

    document.getElementById('chatForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const COOLDOWN_MS = 30 * 1000; // 30 seconds
const lastPost = Number(localStorage.getItem('hyrule_last_post') || 0);
const remaining = Math.ceil((COOLDOWN_MS - (Date.now() - lastPost)) / 1000);
if (remaining > 0) {
  alert(`Please wait ${remaining}s before sending another message.`);
  return;
}
localStorage.setItem('hyrule_last_post', Date.now().toString());
      const name = document.getElementById('chatName').value.trim();
      const game = document.getElementById('chatGameTag').value;
      const message = document.getElementById('chatMessage').value.trim();
      if (!message) return;

      const btn = document.getElementById('chatSubmitBtn');
      btn.disabled = true;
      btn.textContent = '...';

      // Optimistically add to UI immediately
      state.comments.unshift({
        timestamp: 'Just now',
        name,
        game,
        message
      });
      renderComments();
      document.getElementById('chatMessage').value = '';

      if (API_URL && !API_URL.includes("PASTE_YOUR")) {
        try {
          await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight
            body: JSON.stringify({ name, game, message })
          });
        } catch (err) {
          console.error("Failed to post comment:", err);
        }
      }

      btn.disabled = false;
      btn.textContent = 'Send';
    });

    let showAvailableOnly = false;

    function toggleAvailableFilter() {
      showAvailableOnly = !showAvailableOnly;
      const btn = document.getElementById('availFilterBtn');
      const dot = document.getElementById('availDot');

      if (showAvailableOnly) {
        btn.className = "inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-bold border transition bg-emerald-500/20 text-emerald-300 border-emerald-500/50 shadow-sm shadow-emerald-500/10";
        dot.className = "w-2 h-2 rounded-full bg-emerald-400";
      } else {
        btn.className = "inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-bold border transition bg-slate-900 text-slate-300 border-slate-700 hover:border-emerald-500/50";
        dot.className = "w-2 h-2 rounded-full bg-slate-500";
      }
      applyFilters();
    }

    function parseNumber(val) {
      if (val === undefined || val === null || val === '') return null;
      // Takes the first number before a slash (e.g., "10/10" -> 10) and strips commas/text
      const clean = String(val).split('/')[0].replace(/[^0-9.]/g, '');
      const num = parseFloat(clean);
      return isNaN(num) ? null : num;
    }

    function applyFilters() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const sortBy = document.getElementById('sortSelect').value;

      const filtered = state.games.filter(g => {
        const matchesSearch = g.title.toLowerCase().includes(q) ||
          (g.genre && g.genre.toLowerCase().includes(q));
        const matchesAvail = !showAvailableOnly || /ငှားနိုင်သည်/i.test(g.availability || '');
        return matchesSearch && matchesAvail;
      });

      if (sortBy !== 'default') {
        filtered.sort((a, b) => {
          if (sortBy === 'title-asc') {
            return a.title.localeCompare(b.title);
          }
          if (sortBy === 'score-desc') {
            return (parseNumber(b.score) ?? -1) - (parseNumber(a.score) ?? -1);
          }
          if (sortBy === 'year-desc') {
            return (parseNumber(b.releaseYear) ?? 0) - (parseNumber(a.releaseYear) ?? 0);
          }
          if (sortBy === 'price-asc') {
            return (parseNumber(a.price) ?? Infinity) - (parseNumber(b.price) ?? Infinity);
          }
          if (sortBy === 'price-desc') {
            return (parseNumber(b.price) ?? -1) - (parseNumber(a.price) ?? -1);
          }
          return 0;
        });
      }

      renderShelf(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    init();
  </script>
</body>
